# ============================================================
# CI — GitHub Actions
# Berjalan di infrastruktur GitHub (gratis), TIDAK menyentuh
# instance Render sama sekali. Melindungi deploy Render: kode
# yang merusak test/lint tidak akan lolos ke production.
#
# Jobs:
#   test — compile check + 507 unit test (unittest, tanpa network)
#   lint — ruff (config di pyproject.toml)
# ============================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.11 = versi production (Dockerfile). 3.9 = minimum
        # yang didukung kode (zoneinfo fallback, asyncio.to_thread).
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check (syntax semua file .py)
        run: python -m compileall -q .

      - name: Run unit tests
        run: python -m unittest discover -s tests

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Run ruff
        run: ruff check .
