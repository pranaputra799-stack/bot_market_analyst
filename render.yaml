# ============================================================
# render.yaml — Render Blueprint (deploy otomatis dari GitHub)
# ============================================================
# Cara pakai:
#   1. Push repo ini ke GitHub:
#        git remote add origin https://github.com/<user>/<repo>.git
#        git push -u origin master
#   2. Render Dashboard → New → Blueprint → pilih repo → Apply.
#      Render membaca file ini, build Dockerfile, dan buat service free.
#   3. Isi env secret (TELEGRAM_BOT_TOKEN dll) di dashboard Render →
#      Environment. Variabel bertanda `sync: false` TIDAK boleh kosong:
#      tanpa TELEGRAM_BOT_TOKEN bot hanya idle (tidak crash-loop).
#
# Mode: WEBHOOK OTOMATIS. Render meng-inject RENDER_EXTERNAL_URL & PORT →
# config/settings.py mendeteksi IS_RENDER → main.py memilih mode webhook.
# Tidak perlu menyetel WEBHOOK_URL / PORT manual.
#
# Webhook dijalankan server aiohttp MILIK KITA (main.build_webhook_app):
# POST /<token> → update Telegram, GET /health → 200 JSON. Karena itu
# `healthCheckPath: /health` aman dipakai (Render health check mendapat 200)
# dan UptimeRobot bisa keep-alive lewat URL /health.
#
# PENTING: free tier Render tidur setelah ~15 menit tanpa traffic masuk.
# Buat monitor UptimeRobot (gratis) → HTTP(S) →
# https://<app>.onrender.com/health → interval 5 menit agar bot selalu
# bangun (lihat README bagian Render).
# ============================================================
services:
  - type: web
    name: marketai-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    numInstances: 1
    autoDeploy: true
    # /health publik disediakan server webhook aiohttp kita (GET → 200 JSON).
    healthCheckPath: /health
    envVars:
      # --- Wajib (isi manual di dashboard; sync: false = secret) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # --- Opsional ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OANDA_API_KEY
        sync: false
      # --- Tetap (nilai default aman; bisa di-override di dashboard) ---
      # Webhook DIPAKSA: Render wajib mendeteksi port 0.0.0.0:PORT untuk
      # deploy sukses (tanpa webhook server tidak bind port publik). URL
      # otomatis dari RENDER_EXTERNAL_URL (config/settings.py).
      - key: BOT_RUN_MODE
        value: webhook
      - key: HEALTH_ENDPOINT_ENABLED
        value: "true"
      - key: LOG_TO_FILE
        value: "0"
